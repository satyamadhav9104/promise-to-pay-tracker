<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Header Bar -->
  <rect x="40" y="40" width="1120" height="70" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <circle cx="75" cy="75" r="16" fill="#6366f1" />
  <text x="75" y="81" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡</text>
  <text x="105" y="82" font-size="24" font-weight="bold" fill="#ffffff">SMARTINVOICE</text>
  <text x="285" y="82" font-size="16" fill="#94a3b8">|  Razorpay AI Buildathon — Track 03: AI Revenue Recovery</text>
  
  <rect x="960" y="58" width="170" height="34" rx="17" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1" />
  <circle cx="980" cy="75" r="5" fill="#22c55e" />
  <text x="995" y="81" font-size="14" font-weight="bold" fill="#4ade80">DEMO MODE LIVE</text>

  <!-- Dashboard Metrics Cards -->
  <!-- Card 1: Revenue at Risk -->
  <rect x="40" y="135" width="350" height="120" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <text x="65" y="170" font-size="14" font-weight="600" fill="#94a3b8">REVENUE AT RISK</text>
  <text x="65" y="215" font-size="36" font-weight="bold" fill="#ef4444">₹14,85,000</text>
  <text x="270" y="212" font-size="13" fill="#f87171" font-weight="bold">⚠️ 12 Overdue</text>

  <!-- Card 2: Receivables -->
  <rect x="425" y="135" width="350" height="120" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <text x="450" y="170" font-size="14" font-weight="600" fill="#94a3b8">MONEY TO RECEIVE (RECEIVABLES)</text>
  <text x="450" y="215" font-size="36" font-weight="bold" fill="#22c55e">₹42,50,000</text>
  <text x="665" y="212" font-size="13" fill="#4ade80" font-weight="bold">📈 50 Invoices</text>

  <!-- Card 3: Payables -->
  <rect x="810" y="135" width="350" height="120" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <text x="835" y="170" font-size="14" font-weight="600" fill="#94a3b8">PENDING VENDOR BILLS (PAYABLES)</text>
  <text x="835" y="215" font-size="36" font-weight="bold" fill="#38bdf8">₹18,20,000</text>
  <text x="1050" y="212" font-size="13" fill="#38bdf8" font-weight="bold">💳 8 Bills</text>

  <!-- Main AI Cash Flow Advisor Card -->
  <rect x="40" y="280" width="1120" height="150" rx="16" fill="url(#card-grad)" stroke="#8b5cf6" stroke-width="2" />
  <rect x="65" y="305" width="140" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.2" stroke="#a855f7" stroke-width="1" />
  <text x="77" y="324" font-size="13" font-weight="bold" fill="#c084fc">✨ AI Cash Flow Advisor</text>
  <text x="65" y="365" font-size="18" font-weight="600" fill="#f8fafc">Recommendation for Acme Corp Invoice (₹4,50,000):</text>
  <text x="65" y="395" font-size="15" fill="#cbd5e1">"Settle Acme Corp vendor bill on Aug 24 after customer receivables arrive on Aug 23. Preserves ₹2,40,000 buffer liquidity."</text>

  <!-- HITL Human-in-the-Loop Card Preview -->
  <rect x="40" y="455" width="1120" height="135" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <rect x="65" y="480" width="170" height="28" rx="14" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1" />
  <text x="77" y="499" font-size="13" font-weight="bold" fill="#93c5fd">📬 Customer Reply Extracted</text>
  <text x="250" y="499" font-size="14" fill="#e2e8f0">"We will process payment for INV-1001 by August 23."</text>
  <rect x="820" y="485" width="150" height="40" rx="10" fill="#22c55e" />
  <text x="895" y="510" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✓ Approve Date</text>
  <rect x="990" y="485" width="140" height="40" rx="10" fill="#ef4444" fill-opacity="0.2" stroke="#f87171" stroke-width="1" />
  <text x="1060" y="510" font-size="14" font-weight="bold" fill="#f87171" text-anchor="middle">✕ Reject Date</text>
</svg>